<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Песочница · Тригонометрия</title><link rel="stylesheet" href="style.css?v=3"><script defer src="app.js?v=3"></script><header><a href="index.html">Тригонометрия <small>10 класс</small></a><nav aria-label="Разделы"><a href="index.html">Обратные функции</a><a href="equations.html">Уравнения</a><a href="inequalities.html">Неравенства</a><a href="practice.html">Задачи</a><a href="sheet.html">Шпаргалка</a><a href="sandbox.html" aria-current="page">Песочница</a></nav></header><main><section><h1>Песочница</h1><p>Задайте своё значение a. Сравните уравнение и неравенство или проверьте конкретный угол.</p>
<div class="panel" id="sandbox-panel"><label>Что исследуем <select id="sandbox-mode"><option value="eq">Уравнение</option><option value="ineq">Неравенство</option></select></label>
<label>Точное значение a <input id="sandbox-value" type="text" value="1/2" placeholder="1/2, √2/2 или 0,5"></label>
<p class="legend">Можно ввести число, дробь, корень или π. Например: −1/2, √2/2, π/3.</p>
<p id="sandbox-error" role="status"></p>
<div id="sandbox-eq"><div id="eq-controls" class="controls"></div><canvas id="eq-graph" role="img" aria-label="График и корни"></canvas><canvas id="unit-circle" role="img" aria-label="Корни на окружности"></canvas><p id="eq-result" class="result"></p></div>
<div id="sandbox-ineq" hidden><div id="ineq-controls" class="controls"></div><canvas id="ineq-graph" role="img" aria-label="График и интервалы"></canvas><p id="ineq-result" class="result"></p></div>
<label>Проверить угол x (радианы) <input id="sandbox-angle" value="π/6"></label><p id="sandbox-check" class="result" aria-live="polite"></p></div></section></main></html>
